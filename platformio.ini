; Portable PlatformIO configuration for three ESP32 + SX1278 nodes.
; Select the environment that matches the NODE_ID you want to flash.
;
; Examples:
;   pio run -e node1
;   pio run -e node1 -t upload
;   pio device monitor -b 115200
;
; Serial ports are intentionally NOT hard-coded so this repository works
; across different computers.

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@^0.8.0
monitor_filters =
    time
    colorize
    send_on_enter

[env:node1]
build_flags =
    ${env.build_flags}
    -D NODE_ID=1

[env:node2]
build_flags =
    ${env.build_flags}
    -D NODE_ID=2

[env:node3]
build_flags =
    ${env.build_flags}
    -D NODE_ID=3
